version: '3.8'
services:
  db_task:
    image: postgres:15.2
    volumes:
      - pg-data-task:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_DB=db_task
      - POSTGRES_USER=task_admin
      - POSTGRES_PASSWORD=kDcRDuba-4ZPfZB
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - app-network
  task-spring-app:
    container_name: task-spring-app
    build: ./task-spring-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db_task:5432/db_task
      SPRING_DATASOURCE_USERNAME: task_admin
      SPRING_DATASOURCE_PASSWORD: kDcRDuba-4ZPfZB
    depends_on:
      - db_task
    networks:
      - app-network

volumes:
  pg-data-task:
networks:
  app-network:
    external: true
    name: app-network
    driver: bridge